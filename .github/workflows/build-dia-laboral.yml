name: Build dia laboral APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dia-laboral/**'
      - '.github/workflows/build-dia-laboral.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p dia-laboral assembleDebug
      - name: Verify APK exists
        run: ls -lh dia-laboral/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dia-laboral-APK
          path: dia-laboral/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
